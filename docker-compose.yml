# docker-compose.yml
# To build without BuildKit (if "resolving provenance" hangs):
#   DOCKER_BUILDKIT=0 docker-compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: geoip
      POSTGRES_PASSWORD: geoip_secret
      POSTGRES_DB: geoip
    volumes:
      - pgdata:/var/lib/postgresql/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoip -d geoip"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  geoip-service:
    build:
      context: ./backend/geoip-service
      dockerfile: Dockerfile
    container_name: geoip-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: geoip
      POSTGRES_PASSWORD: geoip_secret
      POSTGRES_DB: geoip
      SERVER_PORT: 8080
      GEOIP_RELEASE_TAG: "20260605"
      GEOIP_MMDB_URL: "https://github.com/Skiddle-ID/geoip2-mirror/releases/download"
      UPDATE_INTERVAL: 168h
      FIRST_UPDATE_DELAY: 30s
      MMDB_DIR: /data/geoip
    volumes:
      - geoip-mmdb:/data/geoip
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  main-backend:
    build:
      context: ./backend/main-backend
      dockerfile: Dockerfile
    container_name: main-backend
    environment:
      SERVER_PORT: 4000
      CONFIG_PATH: /app/config.json
      DATABASE_URL: ${DATABASE_URL:-postgres://geoip:geoip_secret@postgres:5432/geoip?sslmode=disable}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      GUEST_LIMIT: ${GUEST_LIMIT:-3}
      WORKER_SECRET: ${WORKER_SECRET:-change-me-worker-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      postgres:
        condition: service_healthy
      crawler-worker-1:
        condition: service_started
      crawler-worker-2:
        condition: service_started
      crawler-worker-3:
        condition: service_started
    restart: unless-stopped

  crawler-worker-1:
    build:
      context: ./backend/crawler-worker
      dockerfile: Dockerfile
    container_name: crawler-worker-1
    environment:
      PORT: 3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  crawler-worker-2:
    build:
      context: ./backend/crawler-worker
      dockerfile: Dockerfile
    container_name: crawler-worker-2
    environment:
      PORT: 3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  crawler-worker-3:
    build:
      context: ./backend/crawler-worker
      dockerfile: Dockerfile
    container_name: crawler-worker-3
    environment:
      PORT: 3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - main-backend
    restart: unless-stopped

volumes:
  pgdata:
  geoip-mmdb:
