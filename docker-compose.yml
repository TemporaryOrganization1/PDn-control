# docker-compose.yml
# To build without BuildKit (if "resolving provenance" hangs):
#   DOCKER_BUILDKIT=0 docker-compose up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: geoip
      POSTGRES_PASSWORD: geoip_secret
      POSTGRES_DB: geoip
    volumes:
      - pgdata:/var/lib/postgresql/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoip -d geoip"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  geoip-service:
    build:
      context: ./backend/geoip-service
      dockerfile: Dockerfile
    container_name: geoip-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: geoip
      POSTGRES_PASSWORD: geoip_secret
      POSTGRES_DB: geoip
      SERVER_PORT: 8080
      GEOIP_RELEASE_TAG: "20260605"
      GEOIP_MMDB_URL: "https://github.com/Skiddle-ID/geoip2-mirror/releases/download"
      UPDATE_INTERVAL: 168h
      FIRST_UPDATE_DELAY: 30s
      MMDB_DIR: /data/geoip
      IP2LOCATION_TOKEN: ${IP2LOCATION_TOKEN:-}
      IP2LOCATION_DIR: /data/geoip
    volumes:
      - geoip-mmdb:/data/geoip
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  main-backend:
    build:
      context: ./backend/main-backend
      dockerfile: Dockerfile
    container_name: main-backend
    environment:
      SERVER_PORT: 4000
      CONFIG_PATH: /app/config.json
      DATABASE_URL: ${DATABASE_URL:-postgres://geoip:geoip_secret@postgres:5432/geoip?sslmode=disable}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      GUEST_LIMIT: ${GUEST_LIMIT:-3}
      FREE_SCAN_LIMIT: ${FREE_SCAN_LIMIT:-3}
      FREE_SCAN_WINDOW_DAYS: ${FREE_SCAN_WINDOW_DAYS:-30}
      FREE_AI_ITERATIONS: ${FREE_AI_ITERATIONS:-3}
      PAID_AI_ITERATIONS: ${PAID_AI_ITERATIONS:-10}
      WORKER_SECRET: ${WORKER_SECRET:-change-me-worker-secret}
      IMAGE_SECRET: ${IMAGE_SECRET:-change-me-image-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SERVER_NAME: ${SMTP_SERVER_NAME:-}
      SMTP_NETWORK: ${SMTP_NETWORK:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - backend-reports:/app/backend/reports
      - backend-images:/tmp/pdn-disk
    depends_on:
      postgres:
        condition: service_healthy
      crawler-worker-1:
        condition: service_started
      crawler-worker-2:
        condition: service_started
      crawler-worker-3:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  smtp-ipv6-proxy:
    profiles:
      - smtp-ipv6
    build:
      context: ./backend/main-backend
      dockerfile: Dockerfile
    container_name: smtp-ipv6-proxy
    network_mode: host
    entrypoint: ["socat", "-d", "-d"]
    command:
      - TCP4-LISTEN:${SMTP_IPV6_PROXY_PORT:-1587},bind=${SMTP_IPV6_PROXY_BIND:-172.18.0.1},reuseaddr,fork
      - TCP6:${SMTP_IPV6_PROXY_TARGET_HOST:-smtp.yandex.ru}:${SMTP_IPV6_PROXY_TARGET_PORT:-587}
    restart: unless-stopped

  crawler-worker-1:
    init: true
    build:
      context: ./backend/crawler-worker
      dockerfile: Dockerfile
    container_name: crawler-worker-1
    environment:
      PORT: 3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  crawler-worker-2:
    init: true
    build:
      context: ./backend/crawler-worker
      dockerfile: Dockerfile
    container_name: crawler-worker-2
    environment:
      PORT: 3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  crawler-worker-3:
    init: true
    build:
      context: ./backend/crawler-worker
      dockerfile: Dockerfile
    container_name: crawler-worker-3
    environment:
      PORT: 3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
      BACKEND_UPSTREAM: http://main-backend:4000
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-25m}
      SSL_CERTIFICATE: ${SSL_CERTIFICATE:-}
      SSL_CERTIFICATE_KEY: ${SSL_CERTIFICATE_KEY:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - main-backend
    restart: unless-stopped
    volumes:
      - ${LETSENCRYPT_DIR:-pdn-letsencrypt}:/etc/letsencrypt:ro

volumes:
  pgdata:
  geoip-mmdb:
  backend-reports:
  backend-images:
  pdn-letsencrypt:
