# Install on the proxy host, for example:
#   /etc/nginx/conf.d/openrouter-proxy.conf
#
# Replace 203.0.113.10 with the production application server public IP.
# Leaving the documentation IP in place keeps the proxy closed by default.

server {
    listen 37777 ssl;
    http2 on;
    server_name manapi.ru;

    ssl_certificate /etc/letsencrypt/live/manapi.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manapi.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    allow 195.133.73.22;
    deny all;

    location /api/v1/ {
        proxy_pass https://openrouter.ai/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host openrouter.ai;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Accept $http_accept;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_name openrouter.ai;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}
