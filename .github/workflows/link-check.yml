name: Link Checker

on:
  push:
    branches: [main]  # Adjust to your default branch name if different
  pull_request:

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --cache
            --max-cache-age 1d
            --no-progress
            --exclude localhost
            --exclude https://gitlab.pg.innopolis.university/
            --exclude https://pdn2.neurolife.tech/
            --exclude-path course_information_swp26
            --exclude-path node_modules
            --exclude-path coverage
            --exclude-path .next
            './**/*.md'
          fail: true
          jobSummary: true
      
      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated
