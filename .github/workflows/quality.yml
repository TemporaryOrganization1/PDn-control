name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  main-backend:
    name: Main Backend Go Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/main-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: backend/main-backend/go.sum

      - name: Formatting check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Static analysis
        run: go vet ./...

      - name: Unit and integration tests with coverage
        run: |
          go test ./... -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out

      - name: Automated quality requirement tests
        run: |
          go test ./internal/workerpool -run TestQRTWorkerSelectionCompletesWithinThreshold -count=1
          go test ./internal/api -run TestValidEmail -count=1

      - name: Additional QA dependency vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-backend-coverage
          path: backend/main-backend/coverage.out

  geoip-service:
    name: GeoIP Service Go Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/geoip-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache-dependency-path: backend/geoip-service/go.sum

      - name: Formatting check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Static analysis
        run: go vet ./...

      - name: Unit and integration tests with coverage
        run: |
          go test ./... -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out

      - name: Additional QA dependency vulnerability scan
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geoip-service-coverage
          path: backend/geoip-service/coverage.out

  frontend:
    name: Frontend Node Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm test -- --coverage

      - name: Additional QA dependency vulnerability scan
        run: npm audit --audit-level=high --omit=dev

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

  crawler-worker:
    name: Crawler Worker Node Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/crawler-worker
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/crawler-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Automated quality requirement test - type-check feedback
        run: npm run typecheck

      - name: Unit and integration tests with coverage
        run: npm test -- --coverage

      - name: Automated quality requirement test - invalid URL protection
        run: npm test -- --run tests/runner.test.ts

      - name: Additional QA dependency vulnerability scan
        run: npm audit --audit-level=high --omit=dev

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crawler-worker-coverage
          path: backend/crawler-worker/coverage
