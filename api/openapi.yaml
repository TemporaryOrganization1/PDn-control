openapi: 3.0.3
info:
  title: PDn-control API
  description: API for website compliance checks, user sessions, and guest request limits.
  version: 1.2.0
servers:
  - url: http://localhost/api
    description: Docker Compose frontend proxy
paths:
  /auth/register:
    post:
      summary: Register a user and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: Invalid email or weak password
        '409':
          description: Email already exists

  /auth/login:
    post:
      summary: Log in and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Invalid email or password

  /auth/logout:
    post:
      summary: Delete the current session cookie
      responses:
        '200':
          description: Logged out

  /auth/change-password:
    post:
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          description: Weak password or invalid payload
        '401':
          description: Unauthorized or invalid current password

  /auth/me:
    get:
      summary: Get current user and guest limit state
      responses:
        '200':
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

  /check:
    post:
      summary: Initiate a compliance check task
      description: The backend derives an immutable scan profile from the current plan. Guests and free accounts receive 3 accepted scans in an exact rolling 30-day window; paid accounts are unlimited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
      responses:
        '200':
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '400':
          description: Invalid URL or check type
        '403':
          description: Rolling Free/guest scan limit reached
        '503':
          description: No workers available

  /progress/{reqId}:
    get:
      summary: Get task progress
      parameters:
        - name: reqId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskState'
        '401':
          description: Authentication is required for an account-owned task
        '403':
          description: Task belongs to a different browser or account
        '404':
          description: Task not found

  /progress:
    post:
      summary: Internal worker progress callback
      description: Requires the X-Worker-Secret header configured on the backend.
      responses:
        '200':
          description: Progress updated
        '403':
          description: Invalid worker secret

  /reports:
    get:
      summary: Get check history for the current user
      responses:
        '200':
          description: Check history ordered newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckHistory'
        '401':
          description: Unauthorized

  /reports/{reportId}:
    get:
      summary: Download a PDF report
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PDF report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Report not found
    delete:
      summary: Delete a saved report and its related PDF/images
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Report not found

  /img/{id}:
    get:
      summary: Get an uploaded evidence image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evidence image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication required
        '403':
          description: Image does not belong to the current user or scan profile
        '404':
          description: Image not found or expired

  /guest/remaining:
    get:
      deprecated: true
      summary: Get legacy-shaped remaining free checks for the current client
      responses:
        '200':
          description: Guest limit state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestInfo'

  /usage:
    get:
      summary: Get the current plan and rolling scan quota
      responses:
        '200':
          description: Current scan quota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanQuota'

  /subscription/change:
    post:
      summary: Activate or deactivate the account Paid plan
      description: Current MVP self-service plan control for authenticated users. Paid activation lasts 30 days and does not process a payment or renew automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  enum: [free, paid]
      responses:
        '200':
          description: Plan changed and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangeResponse'
        '400':
          description: Malformed JSON payload or invalid plan value
        '401':
          description: Unauthorized
        '500':
          description: Plan persistence failed

  /workers:
    get:
      summary: Get worker pool status
      responses:
        '200':
          description: Worker status

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy

components:
  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: strong-password

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 8
        newPassword:
          type: string
          minLength: 8

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        plan:
          type: string
          enum: [free, paid]
        plan_expires_at:
          type: string
          format: date-time

    GuestInfo:
      type: object
      properties:
        limit:
          type: integer
          example: 3
        used:
          type: integer
          example: 1
        remaining:
          type: integer
          example: 2

    MeResponse:
      type: object
      properties:
        user:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AuthUser'
        guest:
          $ref: '#/components/schemas/GuestInfo'

    ScanProfile:
      type: object
      required: [tier, detail_level, ai_iterations, pdf_enabled, screenshots_enabled]
      properties:
        tier:
          type: string
          enum: [guest, free, paid, legacy_full]
        detail_level:
          type: string
          enum: [summary, full]
        ai_iterations:
          type: integer
          minimum: 1
          maximum: 10
        pdf_enabled:
          type: boolean
        screenshots_enabled:
          type: boolean

    ScanQuota:
      type: object
      required: [tier, limited]
      properties:
        tier:
          type: string
          enum: [guest, free, paid]
        limited:
          type: boolean
        limit:
          type: integer
        used:
          type: integer
        remaining:
          type: integer
        window_days:
          type: integer
        next_available_at:
          type: string
          format: date-time

    PlanChangeResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: Платный тариф активирован на 30 дней

    CheckRequest:
      type: object
      required: [url, type]
      properties:
        url:
          type: string
          format: uri
          example: https://example.com
        type:
          type: string
          enum: [fast, detail]
          example: detail

    CheckResponse:
      type: object
      properties:
        code:
          type: string
          example: ERR_OK
        req-id:
          type: string
        data:
          type: object
          properties:
            status:
              type: string
            req-id:
              type: string
            scan_profile:
              $ref: '#/components/schemas/ScanProfile'
            quota:
              $ref: '#/components/schemas/ScanQuota'
        msg:
          type: string

    TaskState:
      type: object
      properties:
        req-id:
          type: string
        url:
          type: string
        type:
          type: string
        status:
          type: string
        worker:
          type: string
        progress:
          type: integer
        results:
          type: array
          description: Backward-compatible alias of ReportPayload.checks.
          items:
            $ref: '#/components/schemas/CheckResult'
        screenshotId:
          type: string
          nullable: true
          description: Top-level website screenshot image id.
        ssl:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SslInfo'
        about:
          type: string
          nullable: true
          description: Top-level short site description.
        country:
          type: string
          nullable: true
          description: ISO alpha-2 country code, unknown, or null.
        errors:
          type: array
          items:
            type: string
        report_id:
          type: string
        created_at:
          type: string
          format: date-time
        scan_profile:
          $ref: '#/components/schemas/ScanProfile'

    CheckResult:
      type: object
      properties:
        id:
          type: string
        result:
          type: string
          enum: [ok, warn, fail, unknown]
        pages:
          type: array
          items:
            type: string
        about:
          type: string
        images:
          type: array
          description: Evidence image ids served through /img/{id}.
          items:
            type: string
        data:
          type: object
          additionalProperties: true

    SslInfo:
      type: object
      properties:
        issuer:
          type: string
        validFrom:
          type: integer
          format: int64
        validTo:
          type: integer
          format: int64
        protocol:
          type: string
        subjectName:
          type: string
        subjectAlternativeNames:
          type: array
          items:
            type: string

    ReportPayload:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
        screenshotId:
          type: string
          nullable: true
        ssl:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SslInfo'
        about:
          type: string
          nullable: true
        country:
          type: string
          nullable: true

    CheckHistory:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        req_id:
          type: string
        url:
          type: string
        check_type:
          type: string
        status:
          type: string
        report_id:
          type: string
        created_at:
          type: string
          format: date-time
        file_name:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
        screenshotId:
          type: string
          nullable: true
        ssl:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SslInfo'
        about:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        scan_profile:
          $ref: '#/components/schemas/ScanProfile'
